name: Bug report (English)
description: An algorithm will not load, does not show up, or switching fails
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One misunderstanding first:

        **An algorithm missing from `comp_algorithm` does not mean it failed to
        load.** That file prints zram's compile-time `backends[]` array; an
        algorithm added by a module works but does not appear there by itself.
        Judge availability by `/proc/crypto` and by actually switching to it
        (the form below asks for both).

  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: "e.g. OPPO Find X7 (PHZ110), Android 14, ColorOS 15"
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel version
      description: Full output of `uname -r`, not just "6.1"
      placeholder: "e.g. 6.1.157-android14-11-o-g2d576b643492"
    validations:
      required: true

  - type: input
    id: module_version
    attributes:
      label: Module version
      placeholder: "e.g. v0.1.4"
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: Symptom
      multiple: true
      options:
        - Module will not install / is not listed by the manager
        - Installs but the .ko never loads (absent from lsmod)
        - insmod reports an error
        - Algorithm absent from /proc/crypto
        - Algorithm missing from comp_algorithm (may be a display issue only)
        - Switching the algorithm fails
        - Boot hangs / reboots / drops to safe mode
        - Other
    validations:
      required: true

  - type: textarea
    id: action_output
    attributes:
      label: Action button output
      description: Full output after pressing the Action button on the KernelSU module page; it covers most of what is needed
      render: shell
    validations:
      required: true

  - type: textarea
    id: cryptolist
    attributes:
      label: Registered compression algorithms
      description: |
        `awk '/^name/ {n=$3} /^type/ {if ($3=="compression") print n}' /proc/crypto | sort -u`
      render: shell
    validations:
      required: true

  - type: textarea
    id: loadlog
    attributes:
      label: Load log
      description: |
        `cat /data/adb/modules/zram_lkm/zram_lkm.log`
        If you insmodded by hand, paste that command's full output too,
        together with the matching lines from dmesg.
      render: shell
    validations:
      required: false

  - type: textarea
    id: bootlog
    attributes:
      label: Boot logs
      description: |
        Without these, boot problems usually cannot be diagnosed. Attach them
        **as files**, not screenshots.

        1. This boot's kernel log
           su -c dmesg > /sdcard/dmesg.txt

        2. The module's own log
           su -c 'cat /data/adb/modules/zram_lkm/zram_lkm.log' > /sdcard/zram_lkm.log

        3. For hangs, reboots or safe mode: the *previous* boot's log
           su -c 'cat /sys/fs/pstore/console-ramoops-0' > /sdcard/pstore.txt
           older kernels: /proc/last_kmsg

        Also useful:
           su -c 'cat /proc/crypto' > /sdcard/crypto.txt
           su -c lsmod > /sdcard/lsmod.txt

        No root? Write "no root, cannot capture" and describe what you saw.
      placeholder: |
        Upload the .txt files, or paste the relevant parts here.
    validations:
      required: true

  - type: textarea
    id: bootimg
    attributes:
      label: Boot image (strongly recommended for load failures)
      description: |
        Every vendor trims a different set of EXPORT_SYMBOLs. The zram/crypto
        helpers are among the ones vendors cut most often. A log tells us what
        is *missing*; only the boot image tells us what this kernel actually
        *exports*. With it I can check every module against your kernel
        **before** you flash anything -- no more round-trips of
        "flash -> fails -> send log".

        How to get it (pick one):

        1. From the official firmware package (no root needed)
           Unpack the full OTA for your exact model. boot.img or
           init_boot.img is usually inside.

        2. dd from the device (root required)
           su -c 'ls -l /dev/block/by-name/boot*'
           su -c 'dd if=/dev/block/by-name/boot_a of=/sdcard/boot.img'
           On A/B devices try boot_a and boot_b -- whichever reads.

        3. From payload.bin via payload_dumper
           https://github.com/vm03/payload_dumper

        Privacy: boot.img contains the kernel and ramdisk only -- no personal
        data, accounts or apps.

        Not comfortable sharing it? Run this instead and paste the output.
        The result is identical:

           su -c "grep -a '__ksymtab_' /proc/kallsyms | sed 's/.*__ksymtab_//' | sort -u" > exports.txt
      placeholder: |
        Attach boot.img as a file, or paste the exports.txt content here
        (about 20k symbol names), or write "cannot obtain" if neither is
        possible.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: Retested on the latest version
          required: true
        - label: Confirmed the major.minor in `uname -r` (e.g. 6.1) matches the KMI of the module being loaded
          required: true
        - label: Understand that comp_algorithm is display only; availability is judged by /proc/crypto and an actual switch
          required: true