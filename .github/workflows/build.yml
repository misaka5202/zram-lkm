name: build

# 为全部支持的 arm64 GKI KMI 构建 ZRAM 压缩算法模块，并打包成按 KMI
# 自动选择的 KernelSU 模块。
#
# 产物:
#   lz4k-<kmi>.ko       Huawei LZ4K
#   lz4kd-<kmi>.ko      Huawei LZ4K delta 变体
#   lz4k_oplus-<kmi>.ko OPPO 变体
#   zram-lkm-<ver>-<kmi>-arm64.zip  单 KMI 模块包
#   zram-lkm-<ver>-arm64.zip        全 KMI 合并包，开机按 uname -r 自动选
#   source-<ver>.tar.gz             源码快照（GPL-2.0 要求）
#
# <ver> 取自 module/module.prop 的 version=（例如 v0.1.4）。原先不带版本号，
# 下载下来一堆同名 zip 分不清是哪个版本，也看不出手里的是新是旧。
#
# 为什么这些能做成模块而不需要重编内核：
#   crypto 压缩算法通过 crypto_register_alg() 注册，是开放的算法名空间。
#   内核里 CONFIG_CRYPTO_* 只是决定了「默认有哪些算法」，新增算法完全可以
#   用模块补上。zram 在选算法时（comp_algorithm 写入）会 request_module()
#   对应 crypto-<name>，所以模块甚至能按需自动加载。
#
# 构建用 SukiSU-Ultra 的 DDK 容器，内含该 KMI 真实的 vmlinux +
# Module.symvers + 匹配的 clang 工具链。

# 可复用构建工作流：只编译 + 打包 + 上传产物，**不发布**。
# 由 ci.yml（push / PR）和 release.yml（打 tag）调用。
on:
  workflow_call:
    inputs:
      kmis:
        description: '逗号分隔的 KMI 列表，留空=全部'
        required: false
        type: string
        default: ''
      package:
        description: '是否打包模块 zip（只有发布需要）'
        required: false
        type: boolean
        default: false
      ddk_release:
        description: 'DDK 镜像 release 标签（镜像名的一部分，不能空）'
        required: false
        type: string
        default: '20260828'
  workflow_dispatch:
    inputs:
      kmis:
        description: '逗号分隔的 KMI 列表, 留空=全部'
        required: false
        type: string
        default: ''
      package:
        description: '是否打包模块 zip'
        required: false
        type: boolean
        default: false
      ddk_release:
        description: 'DDK 镜像 release 标签（镜像名的一部分，不能空）'
        required: false
        type: string
        default: '20260828'

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  DEFAULT_KMIS: 'android12-5.10,android13-5.10,android13-5.15,android14-5.15,android14-6.1,android15-6.6,android16-6.12'

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Compute KMI matrix
        id: set
        env:
          REQUESTED: ${{ inputs.kmis }}
        run: |
          set -euo pipefail
          kmis="${REQUESTED:-$DEFAULT_KMIS}"
          # 用 jq 而不是内联 python：内联 python 的引号在 YAML 折叠后容易
          # 产生空输出，而空 matrix 会让 build job 根本不创建，日志里只看到
          # prepare 成功、package 失败，很难定位。
          # strategy.matrix 必须是**映射**，不能是裸数组。
          # 之前输出 ["android12-5.10", ...]，fromJson 拿到数组，
          # GitHub 无法展开成 job，结果 build 一个都没创建，日志里只看到
          # prepare 成功 + package 失败，完全看不出真正原因。
          json=$(printf '%s' "$kmis" | tr ',' '\n' | sed '/^$/d' \
                 | tr -d ' ' | jq -R . | jq -s -c '{kmi: .}')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "KMI 列表: $kmis"
          echo "matrix JSON: $json"
          [ "$json" != "[]" ] || { echo "::error::KMI matrix 为空"; exit 1; }

  build:
    name: Build (${{ matrix.kmi }})
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ inputs.ddk_release }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: 检出
        uses: actions/checkout@v6

      - name: 编译模块
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -uo pipefail
          KDIR="/opt/ddk/kdir/$KMI"
          test -d "$KDIR" || { echo "::error::DDK 目录不存在: $KDIR"; ls /opt/ddk/kdir; exit 1; }
          chmod +x "$GITHUB_WORKSPACE/scripts/build_modules.sh"
          bash "$GITHUB_WORKSPACE/scripts/build_modules.sh" \
            "$KMI" "$KDIR" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/out"

      - name: 校验
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          fail=0
          for f in "$OUT"/*.ko; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            echo "=== $n ==="
            vm=$(modinfo -F vermagic "$f" 2>/dev/null \
                 || strings "$f" | grep -m1 'vermagic=' | sed 's/vermagic=//')
            echo "  vermagic : $vm"
            echo "  大小     : $(du -h "$f" | cut -f1)"

            # struct module 尺寸：设备上厂商 ko 统一 1088 (0x440)。
            # 这是比 vermagic 更硬的 ABI 判据。
            tm=$(readelf -SW "$f" 2>/dev/null | awk '/this_module/{print $6; exit}')
            if [ -n "$tm" ]; then
              dec=$((16#$tm))
              echo "  this_module: 0x$tm = $dec 字节"
              [ "$dec" -eq 1088 ] || echo "  ::warning::$n this_module 非 1088，设备可能拒绝加载"
            fi

            # 算法名必须出现在 modinfo 的 alias 里，否则 zram 写
            # comp_algorithm 时不会自动 request_module 加载它。
            if modinfo -F alias "$f" 2>/dev/null | grep -q '^crypto-'; then
              echo "  crypto alias: $(modinfo -F alias "$f" 2>/dev/null | grep '^crypto-' | head -1)"
            else
              echo "  ::warning::$n 缺少 crypto-* alias，无法按需自动加载"
            fi

            # 未定义符号必须全部是内核导出符号
            echo "  未定义符号:"
            llvm-nm -u "$f" 2>/dev/null | awk '{print "    " $2}' | head -20 || true
          done
          exit $fail

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ko-${{ matrix.kmi }}
          path: out/
          if-no-files-found: warn

  package:
    name: Package
    needs: [prepare, build]
    # CI 不需要模块 zip 和源码快照，打包只在发布时做
    if: always() && needs.build.result != 'cancelled' && inputs.package
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v6

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          pattern: ko-*
          path: ko-all
          merge-multiple: true

      - name: 整理
        run: |
          set -euo pipefail
          mkdir -p dist
          # download-artifact 的 merge-multiple 偶尔会把文件留在子目录里，
          # 或者合并没落盘（见过最后一个 artifact 缺 'completed successfully'
          # 行、随后 ko-all/*.ko 匹配不到）。所以这里不假设层级，递归找。
          echo '=== ko-all 实际内容 ==='
          find ko-all -maxdepth 3 -type f 2>/dev/null | head -40 || true
          found=0
          while IFS= read -r f; do
            cp -f "$f" dist/
            found=$((found + 1))
          done < <(find ko-all -type f -name '*.ko' 2>/dev/null)
          if [ "$found" -eq 0 ]; then
            echo '::error::没有找到任何 .ko，产物下载或合并失败'
            exit 1
          fi
          echo "收集到 $found 个 .ko"
          echo '=== dist ==='
          ls -lh dist/

      - name: 生成源码快照 (GPL-2.0 要求)
        run: |
          set -euo pipefail
          # 版本以 module.prop 为准：它同时决定模块页显示和 update.json，
          # 而从 tag 推断拿不到（tag 推送时 inputs.version 是空的）。
          VER=$(sed -n 's/^version=//p' module/module.prop | head -1)
          [ -n "$VER" ] || VER="v$(date +%Y%m%d-%H%M%S)"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "打包版本: $VER"
          tar --exclude='.git' --exclude='dist' --exclude='ko-all' \
              -czf "dist/source-$VER.tar.gz" .

      - name: 构建 KernelSU 模块
        run: |
          set -euo pipefail
          command -v zip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip; }

          STAGE="$RUNNER_TEMP/ksu"
          rm -rf "$STAGE"; mkdir -p "$STAGE/ko"
          if ! compgen -G "dist/*.ko" > /dev/null; then
            echo "::error::没有可打包的 ko，跳过 KernelSU 模块构建"
            exit 1
          fi

          cp module/module.prop module/customize.sh module/post-fs-data.sh \
             module/service.sh module/uninstall.sh module/action.sh \
             module/i18n.sh "$STAGE/"
          cp scripts/zram-bench.sh "$STAGE/"
          cp ko-all/symcheck-*.txt "$STAGE/" 2>/dev/null || true
          chmod 755 "$STAGE"/*.sh
          sed -i 's/\r$//' "$STAGE"/*.sh "$STAGE/module.prop"

          # 全 KMI 合并包。zram_list 也放进来：Scene 等工具读的正是
          # /sys/block/zram0/comp_algorithm，不加载它就看不到模块提供的算法。
          # 它只钩一个函数（zcomp_available_show），挂不上时静默放弃，
          # 不影响其它模块。
          cp dist/*.ko "$STAGE/ko/"

          # zip -1：.ko 是 ELF，-9 只能多压 9% 却慢十几倍。
          ( cd "$STAGE" && zip -qr1 "$GITHUB_WORKSPACE/dist/zram-lkm-$VER-arm64.zip" . )


          # 按 KMI 拆分
          for f in dist/*.ko; do
            [ -f "$f" ] || continue
            kmi=$(basename "$f" | sed -E 's/^(lz4k|lz4kd|lz4k_oplus|lz4hc|842|zstdn|zstdp)-(.*)\.ko$/\2/')
            case "$kmi" in android*) ;; *) continue ;; esac
            S="$RUNNER_TEMP/one-$kmi"
            rm -rf "$S"; mkdir -p "$S/ko"
            cp dist/*-"$kmi".ko "$S/ko/"
            cp module/module.prop module/customize.sh module/post-fs-data.sh \
               module/service.sh module/uninstall.sh module/action.sh \
               module/i18n.sh "$S/"
            cp scripts/zram-bench.sh "$S/"
            # symcheck 在合并包那步被拷到 $STAGE/（ko-all/symcheck-*.txt），
            # dist/ 里没有 —— 原来写 cp dist/symcheck-*.txt 是无效路径，被
            # `|| true` 吞掉，导致单 KMI 包一直没带清单（v0.1.6 才发现）。
            cp "$STAGE"/symcheck-*.txt "$S/" 2>/dev/null || true
            chmod 755 "$S"/*.sh
            sed -i 's/\r$//' "$S"/*.sh "$S/module.prop"
            ( cd "$S" && zip -qr1 "$GITHUB_WORKSPACE/dist/zram-lkm-$VER-$kmi-arm64.zip" . )
          done

          echo "=== 最终 dist ==="
          ls -lh dist/

      - name: 上传 dist
        # 让 release.yml 直接复用这里的产物，不必再压一遍
        uses: actions/upload-artifact@v7
        with:
          name: zram-lkm-dist
          path: dist/
          if-no-files-found: error
