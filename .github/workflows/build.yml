name: build ZRAM LKM

# 为全部支持的 arm64 GKI KMI 构建 ZRAM 压缩算法模块，并打包成按 KMI
# 自动选择的 KernelSU 模块。
#
# 产物:
#   lz4k-<kmi>.ko       Huawei LZ4K
#   lz4kd-<kmi>.ko      Huawei LZ4K delta 变体
#   lz4k_oplus-<kmi>.ko OPPO 变体
#   zram-lkm-<kmi>-arm64.zip   单 KMI 模块包
#   zram-lkm-arm64.zip         全 KMI 合并包，开机按 uname -r 自动选
#   source-<tag>.tar.gz        源码快照（GPL-2.0 要求）
#
# 为什么这些能做成模块而不需要重编内核：
#   crypto 压缩算法通过 crypto_register_alg() 注册，是开放的算法名空间。
#   内核里 CONFIG_CRYPTO_* 只是决定了「默认有哪些算法」，新增算法完全可以
#   用模块补上。zram 在选算法时（comp_algorithm 写入）会 request_module()
#   对应 crypto-<name>，所以模块甚至能按需自动加载。
#
# 构建用 SukiSU-Ultra 的 DDK 容器，内含该 KMI 真实的 vmlinux +
# Module.symvers + 匹配的 clang 工具链。

on:
  workflow_dispatch:
    inputs:
      kmis:
        description: '逗号分隔的 KMI 列表，留空=全部'
        required: false
        type: string
        default: ''
      ddk_release:
        description: 'DDK 镜像 release 标签'
        required: false
        type: string
        default: '20260828'
      version:
        description: 'Release 版本标签，例 v1.0.0；留空则用 v<日期>-<时间>'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  DEFAULT_KMIS: 'android12-5.10,android13-5.10,android13-5.15,android14-5.15,android14-6.1,android15-6.6,android16-6.12'

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Compute KMI matrix
        id: set
        env:
          REQUESTED: ${{ inputs.kmis }}
        run: |
          set -euo pipefail
          kmis="${REQUESTED:-$DEFAULT_KMIS}"
          # 用 jq 而不是内联 python：内联 python 的引号在 YAML 折叠后容易
          # 产生空输出，而空 matrix 会让 build job 根本不创建，日志里只看到
          # prepare 成功、package 失败，很难定位。
          json=$(printf '%s' "$kmis" | tr ',' '\n' | sed '/^$/d' \
                 | tr -d ' ' | jq -R . | jq -s -c .)
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "KMI 列表: $kmis"
          echo "matrix JSON: $json"
          [ "$json" != "[]" ] || { echo "::error::KMI matrix 为空"; exit 1; }

  build:
    name: Build (${{ matrix.kmi }})
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ inputs.ddk_release }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: 检出
        uses: actions/checkout@v6

      - name: 编译模块
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -uo pipefail
          KDIR="/opt/ddk/kdir/$KMI"
          test -d "$KDIR" || { echo "::error::DDK 目录不存在: $KDIR"; ls /opt/ddk/kdir; exit 1; }
          chmod +x "$GITHUB_WORKSPACE/scripts/build_modules.sh"
          bash "$GITHUB_WORKSPACE/scripts/build_modules.sh" \
            "$KMI" "$KDIR" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/out"

      - name: 校验
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          fail=0
          for f in "$OUT"/*.ko; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            echo "=== $n ==="
            vm=$(modinfo -F vermagic "$f" 2>/dev/null \
                 || strings "$f" | grep -m1 'vermagic=' | sed 's/vermagic=//')
            echo "  vermagic : $vm"
            echo "  大小     : $(du -h "$f" | cut -f1)"

            # struct module 尺寸：设备上厂商 ko 统一 1088 (0x440)。
            # 这是比 vermagic 更硬的 ABI 判据。
            tm=$(readelf -SW "$f" 2>/dev/null | awk '/this_module/{print $6; exit}')
            if [ -n "$tm" ]; then
              dec=$((16#$tm))
              echo "  this_module: 0x$tm = $dec 字节"
              [ "$dec" -eq 1088 ] || echo "  ::warning::$n this_module 非 1088，设备可能拒绝加载"
            fi

            # 算法名必须出现在 modinfo 的 alias 里，否则 zram 写
            # comp_algorithm 时不会自动 request_module 加载它。
            if modinfo -F alias "$f" 2>/dev/null | grep -q '^crypto-'; then
              echo "  crypto alias: $(modinfo -F alias "$f" 2>/dev/null | grep '^crypto-' | head -1)"
            else
              echo "  ::warning::$n 缺少 crypto-* alias，无法按需自动加载"
            fi

            # 未定义符号必须全部是内核导出符号
            echo "  未定义符号:"
            llvm-nm -u "$f" 2>/dev/null | awk '{print "    " $2}' | head -20 || true
          done
          exit $fail

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ko-${{ matrix.kmi }}
          path: out/
          if-no-files-found: warn

  package:
    name: Package
    needs: [prepare, build]
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v6

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          pattern: ko-*
          path: ko-all
          merge-multiple: true

      - name: 整理
        run: |
          set -euo pipefail
          mkdir -p dist
          if compgen -G "ko-all/*.ko" > /dev/null; then
            cp ko-all/*.ko dist/
          else
            echo "::warning::没有下载到任何 ko"
          fi
          echo "=== dist ==="
          ls -lh dist/ || true

      - name: 生成源码快照 (GPL-2.0 要求)
        run: |
          set -euo pipefail
          TAG="${{ inputs.version }}"
          [ -n "$TAG" ] || TAG="v$(date +%Y%m%d-%H%M%S)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          tar --exclude='.git' --exclude='dist' --exclude='ko-all' \
              -czf "dist/source-$TAG.tar.gz" .

      - name: 构建 KernelSU 模块
        run: |
          set -euo pipefail
          command -v zip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip; }

          STAGE="$RUNNER_TEMP/ksu"
          rm -rf "$STAGE"; mkdir -p "$STAGE/ko"
          if ! compgen -G "dist/*.ko" > /dev/null; then
            echo "::error::没有可打包的 ko，跳过 KernelSU 模块构建"
            exit 1
          fi
          cp dist/*.ko "$STAGE/ko/"
          cp ksu/module.prop ksu/customize.sh ksu/post-fs-data.sh ksu/service.sh ksu/uninstall.sh "$STAGE/"
          chmod 755 "$STAGE"/*.sh
          sed -i 's/\r$//' "$STAGE"/*.sh "$STAGE/module.prop"

          # 全 KMI 合并包。zip -1：.ko 是 ELF，-9 只能多压 9% 却慢十几倍。
          ( cd "$STAGE" && zip -qr1 "$GITHUB_WORKSPACE/dist/zram-lkm-arm64.zip" . )

          # 按 KMI 拆分
          for f in dist/*.ko; do
            [ -f "$f" ] || continue
            kmi=$(basename "$f" | sed -E 's/^(lz4k|lz4kd|lz4k_oplus|zstdp)-(.*)\.ko$/\2/')
            case "$kmi" in android*) ;; *) continue ;; esac
            S="$RUNNER_TEMP/one-$kmi"
            rm -rf "$S"; mkdir -p "$S/ko"
            cp dist/*-"$kmi".ko "$S/ko/"
            cp ksu/module.prop ksu/customize.sh ksu/post-fs-data.sh ksu/service.sh ksu/uninstall.sh "$S/"
            chmod 755 "$S"/*.sh
            sed -i 's/\r$//' "$S"/*.sh "$S/module.prop"
            ( cd "$S" && zip -qr1 "$GITHUB_WORKSPACE/dist/zram-lkm-$kmi-arm64.zip" . )
          done

          echo "=== 最终 dist ==="
          ls -lh dist/

      - name: 发布 Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${TAG}"
          {
            echo "在原始 GKI 内核上以**可加载模块**的方式给 ZRAM 补充压缩算法，不重编内核、不刷 boot。"
            echo
            echo "### 包含的算法"
            echo
            echo '| 模块 | 算法名 | 说明 |'
            echo '|---|---|---|'
            echo '| `lz4k` | `lz4k` | 华为 LZ4K，比标准 LZ4 压缩率更高 |'
            echo '| `lz4kd` | `lz4kd` | LZ4K 的 delta 变体，冷热页差异编码 |'
            echo '| `lz4k_oplus` | `lz4k_oplus` | OPPO 分支的 LZ4K |'
            echo
            echo "### 为什么这样可以不重编内核"
            echo
            echo '压缩算法通过 `crypto_register_alg()` 注册，是一套开放的算法名空间。'
            echo '`CONFIG_CRYPTO_*` 只决定内核里默认有哪些算法，新增算法完全可以用模块补。'
            echo '模块带 `MODULE_ALIAS_CRYPTO(...)`，所以 zram 写 `comp_algorithm` 时会'
            echo '`request_module()` 自动加载，不需要手工 insmod。'
            echo
            echo "### 安装"
            echo
            echo '刷入 `zram-lkm-arm64.zip`（全 KMI）或 `zram-lkm-<kmi>-arm64.zip`（单 KMI），重启。'
            echo
            echo '模块在 `post-fs-data` 阶段只做 **加载模块**，不会改动你的 zram 配置。'
            echo
            echo "### 切换算法"
            echo
            echo '```sh'
            echo '# 查看当前可用算法（带 [] 的是当前在用的）'
            echo 'cat /sys/block/zram0/comp_algorithm'
            echo
            echo '# 切换（注意：会重置 zram0，现有内容丢失）'
            echo 'swapoff /dev/block/zram0'
            echo 'echo lz4k > /sys/block/zram0/comp_algorithm'
            echo '# 重新设置大小并启用 swap'
            echo 'echo ${disksize} > /sys/block/zram0/disksize'
            echo 'mkswap /dev/block/zram0 && swapon /dev/block/zram0'
            echo '```'
            echo
            echo '想开机自动切换，在模块目录放 `zram_lkm.conf`：'
            echo
            echo '```sh'
            echo 'ALGO=lz4k_oplus'
            echo 'AUTO_SWITCH=1'
            echo '```'
            echo
            echo '默认 `AUTO_SWITCH=0`：开机自动切换会清掉 swap 里的页，内存紧张时有风险，'
            echo '所以留给你自己决定时机。'
            echo
            echo "### 支持的 KMI"
            echo
            echo '`android12-5.10` `android13-5.10` `android13-5.15` `android14-5.15` `android14-6.1` `android15-6.6` `android16-6.12`'
            echo
            echo '仅 arm64。'
            echo
            echo "### 源码"
            echo
            echo '算法源码来自 SukiSU_patch / ABK 的内核树补丁，本仓库把它们改成树外模块。'
            echo 'GPL-2.0 要求随二进制提供源码，见 `source-*.tar.gz`。'
          } > notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZRAM LKM $TAG" \
            --notes-file notes.md \
            dist/*.ko dist/*.zip dist/source-*.tar.gz