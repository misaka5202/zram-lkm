name: Release

# 真发布：只有打 tag 才会走到这里。
#
# 当前阶段**只发 pre-release**：这些 .ko 只验证到"能编译 + 手动加载过"，
# 还没有跨机型的完整回归。等有正式版了，把 --prerelease 去掉。

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    uses: ./.github/workflows/build.yml
    with:
      package: true

  publish:
    name: publish
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v6

      - name: 下载构建产物
        # Package job 已经产好 .ko、模块 zip 和源码快照（artifact
        # zram-lkm-dist）。这里不再重新打包 —— 之前那版会重压所有 zip，
        # 多花几十秒，而且两份打包逻辑容易走偏。
        uses: actions/download-artifact@v8
        with:
          name: zram-lkm-dist
          path: dist

      - name: 列出产物
        run: |
          set -euo pipefail
          ls -lh dist/
          compgen -G "dist/*.zip" > /dev/null || { echo "::error::没有模块包"; exit 1; }

      - name: 创建 pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # 正文由 scripts/release_notes.sh 生成，格式对齐 KernelSU 的 release：
          #   vX.Y.Z / ## What's Changed / ## Supported kernels / Full Changelog
          # 不再读 docs/RELEASE-NOTES.md —— 那份手工维护的会和 CHANGELOG 走偏
          # （v0.1.4 的正文和 CHANGELOG 就有两套说法）。
          sh scripts/release_notes.sh "$TAG" dist . > notes.md
          cat notes.md

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --prerelease \
            --notes-file notes.md \
            dist/*.ko dist/*.zip dist/source-*.tar.gz
