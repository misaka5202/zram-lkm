name: CI

# 持续集成：推代码、开 PR 时验证能不能编过。
#
# **永不发布** —— 没有 tag、没有 release、没有 update.json 改动。
# 产物只留 Actions artifact，方便人工下载试装。

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:
    inputs:
      kmis:
        description: '要验证的 KMI（逗号分隔）。日常测试编一个就够了'
        required: false
        type: string
        default: 'android14-6.1'
      full_matrix:
        description: '构建全部 KMI（默认只编一个，发布才需要全量）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # i18n.sh 的英文块是基线，zh/ja 只覆盖一部分；缺翻译不会报错，只会静默
      # 回落到英文。所以这一类问题在真机上永远看不见，只能静态查。
      - name: i18n 三种语言对齐
        run: bash scripts/check-i18n.sh

  build:
    name: build
    uses: ./.github/workflows/build.yml
    with:
      # CI 是"这次改动还能不能编译"的快速验证，不是发布前全量回归。
      # 默认只编一个 KMI：镜像拉取是每次构建的固定成本（实测约 54s），
      # 7 个 KMI 就是 7 份，而关键路径只取决于最慢那一个 —— 全量不会让
      # 结果更早出来，只多烧 runner 分钟。需要全量勾 full_matrix。
      kmis: ${{ inputs.full_matrix && '' || (inputs.kmis || 'android14-6.1') }}
      package: false   # CI 不打包，产物只留 ko-* artifact

  summarize:
    name: summarize
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v8
        with:
          pattern: '**/*'
          path: ko-all
          merge-multiple: true

      - name: 汇总
        run: |
          set -euo pipefail
          echo "### 本次构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "ko-all/*.ko" > /dev/null; then
            echo "| 模块 | KMI | 大小 | vermagic |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for f in ko-all/*.ko; do
              n=$(basename "$f" .ko)
              mod=${n%-android*}
              kmi=${n#*-}
              vm=$(grep -ao 'vermagic=[^ ]*' "$f" | head -1 | sed 's/vermagic=//')
              echo "| \`$mod\` | \`$kmi\` | $(du -h "$f" | cut -f1) | \`$vm\` |" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "本次没有产出任何 .ko。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "产物见 Artifacts。CI 不发布；发布请打 tag 走 release.yml。" >> "$GITHUB_STEP_SUMMARY"
