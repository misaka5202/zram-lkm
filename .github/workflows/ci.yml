name: CI

# 持续集成：推代码、开 PR 时验证能不能编过。
#
# **永不发布** —— 没有 tag、没有 release、没有 update.json 改动。
# 产物只留 Actions artifact，方便人工下载试装。

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:
    inputs:
      kmis:
        description: '逗号分隔的 KMI 列表, 留空=全部'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    uses: ./.github/workflows/build.yml
    with:
      kmis: ${{ inputs.kmis || '' }}

  summarize:
    name: summarize
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v8
        with:
          pattern: '**/*'
          path: ko-all
          merge-multiple: true

      - name: 汇总
        run: |
          set -euo pipefail
          echo "### 本次构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "ko-all/*.ko" > /dev/null; then
            echo "| 模块 | KMI | 大小 | vermagic |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for f in ko-all/*.ko; do
              n=$(basename "$f" .ko)
              mod=${n%-android*}
              kmi=${n#*-}
              vm=$(grep -ao 'vermagic=[^ ]*' "$f" | head -1 | sed 's/vermagic=//')
              echo "| \`$mod\` | \`$kmi\` | $(du -h "$f" | cut -f1) | \`$vm\` |" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "本次没有产出任何 .ko。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "产物见 Artifacts。CI 不发布；发布请打 tag 走 release.yml。" >> "$GITHUB_STEP_SUMMARY"
